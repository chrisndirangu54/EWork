name: TeknTandao marketplace commerce and security CI
on:
  pull_request:
    paths:
      - 'marketplace/**'
      - '.gitmodules'
      - '.github/workflows/managed-marketplace.yml'
  push:
    branches: [master]
    paths:
      - 'marketplace/**'
      - '.gitmodules'
      - '.github/workflows/managed-marketplace.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            marketplace/upstream/lancy/package-lock.json
            marketplace/upstream/lancy/backend/package-lock.json
      - name: Apply TeknTandao overlay
        run: |
          bash marketplace/overlay/apply-overlay.sh
          bash marketplace/overlay/verify-overlay.sh
      - name: Install and validate backend
        working-directory: marketplace/upstream/lancy/backend
        run: |
          npm ci
          npx prisma validate
          npx prisma generate
          npx prisma db push
          npm run build
          node -r ts-node/register --test tests/firebase-token.test.ts tests/managed-service.test.ts tests/freelance.test.ts tests/commerce-payment.test.ts tests/private-document.test.ts tests/private-vault-gcs.test.ts tests/global-jobs.test.ts
      - name: Prepare PostgreSQL and Cloud Run image context
        run: |
          node marketplace/deploy/test-production-build.cjs
          cd marketplace/upstream/lancy/backend
          export DATABASE_URL='postgresql://test:test@localhost:5432/tgs?schema=public'
          npx prisma validate --schema prisma/schema.production.prisma
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.production.prisma --script > /tmp/initial-postgres.sql
          grep -q 'CREATE TABLE' /tmp/initial-postgres.sql
      - name: Container image build (no deployment)
        run: |
          mkdir -p /tmp/tgs-production-image
          bash marketplace/deploy/prepare-cloudrun-context.sh /tmp/tgs-production-image
          docker build -t tekntandao-marketplace:ci /tmp/tgs-production-image
      - name: Security source invariants
        run: node marketplace/scripts/security-invariants.cjs
      - name: Dependency security audit (report only; must be cleared before production)
        working-directory: marketplace/upstream/lancy/backend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        working-directory: marketplace/upstream/lancy
        run: |
          npm ci
          npm run build
